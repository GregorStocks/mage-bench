[project]
name = "mage-scripts"
version = "0.1.0"
description = "Mage-bench scripts package"
requires-python = ">=3.11"
dependencies = [
    "puppeteer",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["scripts", "schemas"]

[tool.uv.sources]
puppeteer = { workspace = true }

[tool.uv.workspace]
members = ["puppeteer"]
