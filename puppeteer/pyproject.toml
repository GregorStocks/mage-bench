[project]
name = "puppeteer"
version = "0.1.0"
description = "XMage AI Puppeteer orchestration tool"
requires-python = ">=3.11"
dependencies = [
    "mage-scripts",
    "psutil>=5.9.0",
    "mcp>=1.0.0",
    "openai>=1.0.0",
    "google-api-python-client>=2.0.0",
    "google-auth-oauthlib>=1.0.0",
    "google-auth-httplib2>=0.2.0",
    "pyjson5>=2.0.0",
]

[tool.uv.sources]
mage-scripts = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "ruff>=0.8.0",
    "mypy>=1.13.0",
    "types-psutil>=5.9.0",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "pytest-xdist>=3.5.0",
    "jsonschema>=4.26.0",
    "google-api-python-client-stubs>=1.32.0",
    "google-auth-stubs>=0.3.0",
]

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "SIM",  # flake8-simplify
    "RUF",  # ruff-specific rules
    "PLC0415",  # import-outside-toplevel
    "T10",  # flake8-debugger: catch leftover pdb/breakpoint() calls
    "ISC",  # flake8-implicit-str-concat: catch accidental string concatenation
    "PIE",  # flake8-pie: unnecessary pass, startswith tuple, etc.
    "LOG",  # flake8-logging: proper logging patterns
    "TID",  # flake8-tidy-imports: import clarity
    "RET",  # flake8-return: consistent return patterns
    "PERF", # perflint: catch inefficient patterns
    "BLE001",  # blind-except
    "DTZ005",  # datetime.now without tz
    "DTZ007",  # datetime.strptime without zone
    "A002",  # builtin argument shadowing
    "ANN401",  # Any in public signatures
    "C4",   # flake8-comprehensions: unnecessary comprehension patterns
    "ERA",  # eradicate: commented-out code
    "N",    # pep8-naming: naming conventions
    "PT",   # flake8-pytest-style: pytest best practices
    "S",    # flake8-bandit: security checks
    "ARG",  # flake8-unused-arguments
    "FBT",  # flake8-boolean-trap: boolean positional arguments
]
ignore = [
    "SIM105",  # contextlib.suppress - try/except/pass is fine
    "SIM115",  # context manager for open - not always appropriate
    "PERF203", # try-except in loop - intentional for fault tolerance
    "PT015",  # assert-False - used as unreachable-code marker in production scripts
    "PT018",  # composite assertions - intentional isinstance+truthy checks
    "PT019",  # fixture-param-without-value - idiomatic side-effect fixture pattern
    "S101",   # assert - used pervasively for fail-fast validation
    "S311",   # non-crypto random - game/matchmaking randomization, not security
    "S603",   # subprocess-without-shell-equals-true - all subprocess calls are intentional
    "S607",   # partial-path subprocess - mvn/git/java expected on PATH
    "S314",   # xml.etree - parsing trusted local XMage config files
    "SIM401", # dict-get-or-default - conflicts with no-fallback lint (AGENTS.md)
]
external = []

[tool.ruff.lint.flake8-tidy-imports.banned-api]
"typing.cast".msg = "Don't use cast — fix the underlying types or use assert to narrow."

[tool.ruff.lint.isort]
known-first-party = ["puppeteer", "scripts", "schemas"]

[tool.ruff.lint.per-file-ignores]
"../scripts/add-missing-jumpstart-themes.py" = ["ERA001"]  # deck-variant section labels
"../scripts/*-*.py" = ["N999"]  # hyphenated script filenames are intentional CLI names
"tests/**" = [
    "S105", "S106", "S108", "S310",   # test data: fake credentials, /tmp paths, localhost URLs
    "ARG001", "ARG002", "ARG005",     # fixtures, protocol methods, lambda stubs
    "FBT001", "FBT002", "FBT003",     # boolean params in test helpers
    "ERA001",                          # documentation comments that look like code
    "N815",                            # inputSchema — MCP protocol field name
]
"src/puppeteer/orchestrator.py" = ["FBT001", "FBT002", "ARG001"]  # boolean params, polymorphic signatures
"src/puppeteer/replay.py" = ["FBT001", "FBT002"]  # skip_postscript boolean params
"src/puppeteer/pilot.py" = ["N815"]  # inputSchema — MCP protocol field name
"src/puppeteer/config.py" = ["FBT001"]  # _resolve_personality boolean param
"src/puppeteer/port.py" = ["S108"]  # intentional /tmp lock file
"src/puppeteer/llm_cost.py" = ["S310"]  # HTTPS fetch from OpenRouter API
"../scripts/analysis/toolbox/blunder_quality_analysis.py" = ["N806"]  # intentional UPPERCASE local constants

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
warn_unused_ignores = true
warn_redundant_casts = true
disallow_untyped_defs = true
check_untyped_defs = true
ignore_missing_imports = false

# No working type stubs exist for google_auth_oauthlib (the PyPI package
# google-auth-oauthlib-stubs is broken). Keep this narrow override until
# upstream ships py.typed or a working stubs package appears.
[[tool.mypy.overrides]]
module = ["google_auth_oauthlib.*"]
ignore_missing_imports = true
disable_error_code = ["import-untyped"]


[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = ["golden: Golden prompt integration tests (require XMage server)"]
