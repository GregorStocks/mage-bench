name: Deploy

on:
  push:
    branches: [master]
  pull_request:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
      statuses: write
    env:
      HAS_CLOUDFLARE_SECRETS: ${{ secrets.CLOUDFLARE_API_TOKEN != '' && secrets.CLOUDFLARE_ACCOUNT_ID != '' }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - uses: actions/setup-node@v6
        with:
          node-version: '22'

      - run: npm ci
        working-directory: website

      - run: npm run build
        working-directory: website

      - name: Deploy to Cloudflare Pages
        id: deploy
        if: ${{ env.HAS_CLOUDFLARE_SECRETS == 'true' }}
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy website/dist/ --project-name=mage-bench --branch=${{ github.head_ref || github.ref_name }}

      - name: Print deployment URL
        if: ${{ env.HAS_CLOUDFLARE_SECRETS == 'true' }}
        run: |
          echo "Deployed to ${{ steps.deploy.outputs.deployment-url }}"
          echo "Branch URL: https://${{ github.head_ref || github.ref_name }}.mage-bench.pages.dev"

      - name: Add preview link to commit status
        if: ${{ env.HAS_CLOUDFLARE_SECRETS == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/${{ github.repository }}/statuses/${{ github.sha }}" \
            --method POST \
            -f state=success \
            -f target_url="https://${{ github.head_ref || github.ref_name }}.mage-bench.pages.dev" \
            -f description="Deployed to Cloudflare Pages" \
            -f context="Preview"

      - name: Explain skipped preview deploy
        if: ${{ env.HAS_CLOUDFLARE_SECRETS != 'true' }}
        run: echo "Skipping Cloudflare Pages preview deploy because Cloudflare secrets are unavailable for this event."
