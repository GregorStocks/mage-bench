name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  java:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'maven'

      - uses: actions/cache@v4
        with:
          path: ~/.m2/build-cache
          key: build-cache-${{ github.sha }}
          restore-keys: build-cache-

      - run: mvn install -q -DskipTests -T 1C

  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5

      - run: make lint

      - run: make format-check

      - run: make typecheck

      - run: make test

  golden:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            /*
            !website/public/games
          sparse-checkout-cone-mode: false

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'maven'

      - uses: actions/cache@v4
        with:
          path: ~/.m2/build-cache
          key: build-cache-${{ github.sha }}
          restore-keys: build-cache-

      - uses: astral-sh/setup-uv@v5

      - run: sudo apt-get install -y xvfb

      - run: xvfb-run make test-golden

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: golden-test-logs
          path: tmp/golden-*/
          retention-days: 7

  website:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - run: npm ci
        working-directory: website

      - run: make test-js

      - run: npm run build
        working-directory: website

      - name: Run e2e tests
        run: npx vitest run --config vitest.e2e.config.js
        working-directory: website

