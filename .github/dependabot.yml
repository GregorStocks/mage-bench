version: 2
updates:
  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'weekly'
    groups:
      all:
        patterns: ['*']
  - package-ecosystem: 'maven'
    directory: '/'
    schedule:
      interval: 'weekly'
    groups:
      all:
        patterns: ['*']
  - package-ecosystem: 'npm'
    directory: '/website'
    schedule:
      interval: 'weekly'
    groups:
      all:
        patterns: ['*']
  - package-ecosystem: 'uv'
    directory: '/'
    schedule:
      interval: 'weekly'
    groups:
      all:
        patterns: ['*']
