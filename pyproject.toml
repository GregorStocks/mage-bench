[project]
name = "mage-scripts"
version = "0.1.0"
description = "Mage-bench scripts package"
requires-python = ">=3.11"
dependencies = [
    "puppeteer",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["scripts", "schemas", "src/magebench"]

[tool.uv.sources]
puppeteer = { workspace = true }

[tool.uv.workspace]
members = ["puppeteer"]

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = ["golden: Golden prompt integration tests (require XMage server)"]
