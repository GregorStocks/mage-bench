[project]
name = "mage-scripts"
version = "0.1.0"
description = "Mage-bench Python package"
requires-python = ">=3.11"
dependencies = [
    "psutil>=5.9.0",
    "mcp>=1.27.0",
    "openai>=2.31.0",
    "google-api-python-client>=2.194.0",
    "google-auth-oauthlib>=1.0.0",
    "google-auth-httplib2>=0.2.0",
    "pyjson5>=2.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/magebench"]

[dependency-groups]
dev = [
    "ruff>=0.15.10",
    "mypy>=1.20.1",
    "types-psutil>=7.2.2.20260408",
    "pytest>=9.0.3",
    "pytest-asyncio>=0.24.0",
    "pytest-xdist>=3.5.0",
    "fastjsonschema>=2.21.0",
    "google-api-python-client-stubs>=1.32.0",
    "google-auth-stubs>=0.3.0",
]

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
warn_unused_ignores = true
warn_redundant_casts = true
disallow_untyped_defs = true
check_untyped_defs = true
ignore_missing_imports = false

[[tool.mypy.overrides]]
module = ["google_auth_oauthlib.*"]
ignore_missing_imports = true
disable_error_code = ["import-untyped"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = ["golden: Golden prompt integration tests (require XMage server)"]
