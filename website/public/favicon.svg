<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <defs>
    <style>
      .bg { fill: #16213e; }
      .hat { fill: #e94560; }
      .star { fill: #e94560; }
      @media (prefers-color-scheme: light) {
        .bg { fill: #e8e8f0; }
      }
    </style>
  </defs>
  <!-- Background: rounded square -->
  <rect class="bg" width="128" height="128" rx="20" />
  <!-- Wizard hat: pointed cone with brim -->
  <path class="hat" d="
    M64 14
    L42 88
    L22 88
    C22 88 18 88 18 92
    C18 96 22 96 22 96
    L106 96
    C106 96 110 96 110 92
    C110 88 106 88 106 88
    L86 88
    Z
  " />
  <!-- Hat band -->
  <rect class="bg" x="38" y="82" width="52" height="8" rx="2" />
  <!-- Sparkle at tip: 4-pointed star -->
  <path class="star" d="
    M64 8 L66 12 L70 14 L66 16 L64 20 L62 16 L58 14 L62 12 Z
  " />
  <!-- Small sparkle to the right -->
  <path class="star" d="
    M82 22 L83 24 L85 25 L83 26 L82 28 L81 26 L79 25 L81 24 Z
  " />
</svg>
