version: 2
updates:
  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'weekly'
    cooldown:
      default-days: 7
    groups:
      all:
        applies-to: version-updates
        patterns: ['*']
      all-security:
        applies-to: security-updates
        patterns: ['*']
  - package-ecosystem: 'maven'
    directory: '/'
    schedule:
      interval: 'weekly'
    cooldown:
      default-days: 7
    groups:
      all:
        applies-to: version-updates
        patterns: ['*']
      all-security:
        applies-to: security-updates
        patterns: ['*']
  - package-ecosystem: 'npm'
    directory: '/website'
    schedule:
      interval: 'weekly'
    cooldown:
      default-days: 7
    ignore:
      # TypeScript 7 is unsupported by `astro check` and typescript-eslint
      # (peer `typescript <6.1.0`). Drop this once both support it.
      - dependency-name: 'typescript'
        update-types: ['version-update:semver-major']
    groups:
      all:
        applies-to: version-updates
        patterns: ['*']
      all-security:
        applies-to: security-updates
        patterns: ['*']
  - package-ecosystem: 'uv'
    directory: '/'
    schedule:
      interval: 'weekly'
    cooldown:
      default-days: 7
    groups:
      all:
        applies-to: version-updates
        patterns: ['*']
      all-security:
        applies-to: security-updates
        patterns: ['*']
