name: Deploy

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  deploy:
    if: ${{ github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.pull_request.user.login != 'dependabot[bot]' && github.event.pull_request.head.repo.full_name == github.repository) }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
      statuses: write
    steps:
      - uses: actions/checkout@v6.0.2
        with:
          fetch-depth: 1

      - uses: actions/setup-node@v6
        with:
          node-version: '22'

      - run: npm ci
        working-directory: website

      - run: npm run build
        working-directory: website

      - name: Deploy to Cloudflare Pages
        id: deploy
        uses: cloudflare/wrangler-action@v4.0.0
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy website/dist/ --project-name=mage-bench --branch=${{ github.head_ref || github.ref_name }}

      - name: Print deployment URL
        run: |
          echo "Deployed to ${{ steps.deploy.outputs.deployment-url }}"
          echo "Branch URL: https://${{ github.head_ref || github.ref_name }}.mage-bench.pages.dev"

      - name: Add preview link to commit status
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/${{ github.repository }}/statuses/${{ github.sha }}" \
            --method POST \
            -f state=success \
            -f target_url="https://${{ github.head_ref || github.ref_name }}.mage-bench.pages.dev" \
            -f description="Deployed to Cloudflare Pages" \
            -f context="Preview"
