name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  java:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          sparse-checkout: |
            /*
            !website/public/games
          sparse-checkout-cone-mode: false

      - uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'maven'

      - uses: actions/cache@v5
        with:
          path: ~/.m2/build-cache
          key: build-cache-${{ github.sha }}
          restore-keys: build-cache-

      - uses: astral-sh/setup-uv@v7

      - run: mvn install -q -DskipTests -T 1C

      - run: make lint-java

  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: astral-sh/setup-uv@v7

      - name: Install agent-issues
        run: |
          git clone --depth 1 https://github.com/GregorStocks/agent-issues.git ~/code/agent-issues
          echo "$HOME/code/agent-issues/bin" >> $GITHUB_PATH

      - run: make lint

      - run: make format-check

      - run: make typecheck

      - run: make test

      - run: make leaderboard

      - run: git diff --exit-code -- website/src/data website/public/data

  golden:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
        with:
          sparse-checkout: |
            /*
            !website/public/games
          sparse-checkout-cone-mode: false

      - uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'maven'

      - uses: actions/cache@v5
        with:
          path: ~/.m2/build-cache
          key: build-cache-${{ github.sha }}
          restore-keys: build-cache-

      - uses: astral-sh/setup-uv@v7

      - run: sudo apt-get install -y xvfb

      - run: xvfb-run make test-golden

      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: golden-test-logs
          path: tmp/golden-*/
          retention-days: 7

  website:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: '22'

      - run: npm ci
        working-directory: website

      - run: make test-js

      - run: make lint-md

      - run: npm run build
        working-directory: website

      - name: Run e2e tests
        run: npx vitest run --config vitest.e2e.config.js
        working-directory: website
