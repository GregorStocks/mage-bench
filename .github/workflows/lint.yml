name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  java:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: |
            /*
            !website/public/games
          sparse-checkout-cone-mode: false

      - uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'maven'

      # setup-java's pom-keyed cache snapshots all of ~/.m2/repository,
      # including locally-built org.mage artifacts from whichever commit last
      # changed a pom. Purge them so builds resolve reactor modules from this
      # checkout instead of silently compiling against stale jars.
      - name: Purge locally-built artifacts from Maven dependency cache
        run: rm -rf ~/.m2/repository/org/mage

      - uses: actions/cache@v6.1.0
        with:
          path: ~/.m2/build-cache
          key: build-cache-${{ github.sha }}
          restore-keys: build-cache-

      - uses: astral-sh/setup-uv@v7

      - run: mvn install -q -DskipTests -T 1C

      - run: make lint-java

      - run: make test-java

  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v7

      - name: Install agent-issues
        run: |
          git clone --depth 1 https://github.com/GregorStocks/agent-issues.git ~/code/agent-issues
          mkdir -p "$HOME/.local/bin"
          cat > "$HOME/.local/bin/issue-lint" <<'EOF'
          #!/usr/bin/env bash
          exec uv run --project "$HOME/code/agent-issues" python - "$@" <<'PY'
          import re
          import sys
          from pathlib import Path

          import pyjson5

          from agent_issues.issue_files import iter_issue_files, load_issue

          REQUIRED_FIELDS = {
              "title",
              "description",
              "status",
              "priority",
              "type",
              "labels",
              "created_at",
              "updated_at",
          }
          OPTIONAL_FIELDS = {"blocked"}
          KNOWN_FIELDS = REQUIRED_FIELDS | OPTIONAL_FIELDS
          FILENAME_RE = re.compile(r"^(p[1-4]|blocked)-[a-z0-9][a-z0-9-]*$")
          MAX_LINE_LENGTH = 120


          def expected_filename_prefix(issue: dict) -> str:
              return "blocked" if issue.get("blocked") else f"p{issue['priority']}"


          def lint_issues(project_root: Path) -> list[str]:
              issues_dir = project_root / "issues"
              if not issues_dir.exists():
                  return []

              errors = [
                  f"{legacy_issue_file.name}: legacy issue file extension; rename to .json5"
                  for legacy_issue_file in sorted(issues_dir.glob("*.json"))
              ]

              for issue_file in iter_issue_files(issues_dir):
                  try:
                      issue = load_issue(issue_file)
                  except pyjson5.Json5DecoderException as exc:
                      errors.append(f"{issue_file.name}: invalid JSON5 - {exc}")
                      continue

                  if "id" in issue:
                      errors.append(f"{issue_file.name}: has 'id' field (filename serves as id)")

                  missing = REQUIRED_FIELDS - set(issue.keys())
                  if missing:
                      errors.append(
                          f"{issue_file.name}: missing fields: {', '.join(sorted(missing))}"
                      )
                      continue

                  unknown = set(issue.keys()) - KNOWN_FIELDS
                  if unknown:
                      errors.append(
                          f"{issue_file.name}: unknown fields: {', '.join(sorted(unknown))}"
                      )

                  if not FILENAME_RE.fullmatch(issue_file.stem):
                      errors.append(
                          f"{issue_file.name}: filename must start with p1-/p2-/p3-/p4-/blocked- and use kebab-case"
                      )
                  else:
                      expected = expected_filename_prefix(issue)
                      if not issue_file.stem.startswith(f"{expected}-"):
                          errors.append(
                              f"{issue_file.name}: filename prefix must match priority/blocked state ({expected}-...)"
                          )

                  for line_no, line in enumerate(issue_file.read_text().splitlines(), start=1):
                      if len(line) > MAX_LINE_LENGTH:
                          errors.append(
                              f"{issue_file.name}:{line_no}: line too long ({len(line)} > {MAX_LINE_LENGTH}); run issue-fmt"
                          )

              return errors


          def main() -> int:
              project_root = Path(sys.argv[1]) if len(sys.argv) > 1 else Path.cwd()
              errors = lint_issues(project_root)
              if errors:
                  print("Issue validation errors:")
                  for error in errors:
                      print(f"  {error}")
                  return 1
              return 0


          raise SystemExit(main())
          PY
          EOF
          chmod +x "$HOME/.local/bin/issue-lint"
          echo "$HOME/.local/bin" >> $GITHUB_PATH

      - run: make lint

      - run: make format-check

      - run: make typecheck

      - run: make test

      - run: make leaderboard

      - run: git diff --exit-code -- website/src/data website/public/data

  golden:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: |
            /*
            !website/public/games
          sparse-checkout-cone-mode: false

      - uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'maven'

      # See the java job: never resolve locally-built jars from the pom-keyed
      # dependency cache. The golden fixtures install their own fresh modules.
      - name: Purge locally-built artifacts from Maven dependency cache
        run: rm -rf ~/.m2/repository/org/mage

      - uses: actions/cache@v6.1.0
        with:
          path: ~/.m2/build-cache
          key: build-cache-${{ github.sha }}
          restore-keys: build-cache-

      - uses: astral-sh/setup-uv@v7

      - run: sudo apt-get install -y xvfb

      - run: xvfb-run make test-golden

      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: golden-test-logs
          path: tmp/golden-*/
          retention-days: 7

  website:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6.4.0
        with:
          node-version: '22'

      - run: npm ci
        working-directory: website

      - run: make test-js

      - run: make lint-md

      - run: npm run build
        working-directory: website

      - name: Run e2e tests
        run: npx vitest run --config vitest.e2e.config.js
        working-directory: website
