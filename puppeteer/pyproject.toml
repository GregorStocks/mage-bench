[project]
name = "puppeteer"
version = "0.1.0"
description = "XMage AI Puppeteer orchestration tool"
requires-python = ">=3.10"
dependencies = [
    "mage-scripts",
    "psutil>=5.9.0",
    "mcp>=1.0.0",
    "openai>=1.0.0",
    "google-api-python-client>=2.0.0",
    "google-auth-oauthlib>=1.0.0",
    "google-auth-httplib2>=0.2.0",
]

[tool.uv.sources]
mage-scripts = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "ruff>=0.8.0",
    "mypy>=1.13.0",
    "types-psutil>=5.9.0",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "pytest-xdist>=3.5.0",
    "jsonschema>=4.26.0",
    "google-api-python-client-stubs>=1.32.0",
    "google-auth-stubs>=0.3.0",
]

[tool.ruff]
target-version = "py310"
line-length = 120

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "SIM",  # flake8-simplify
    "RUF",  # ruff-specific rules
    "PLC0415",  # import-outside-toplevel
    "T10",  # flake8-debugger: catch leftover pdb/breakpoint() calls
    "ISC",  # flake8-implicit-str-concat: catch accidental string concatenation
    "PIE",  # flake8-pie: unnecessary pass, startswith tuple, etc.
    "LOG",  # flake8-logging: proper logging patterns
    "TID",  # flake8-tidy-imports: import clarity
    "RET",  # flake8-return: consistent return patterns
    "PERF", # perflint: catch inefficient patterns
]
ignore = [
    "SIM105",  # contextlib.suppress - try/except/pass is fine
    "SIM115",  # context manager for open - not always appropriate
    "PERF203", # try-except in loop - intentional for fault tolerance
]
external = []

[tool.ruff.lint.flake8-tidy-imports.banned-api]
"typing.cast".msg = "Don't use cast — fix the underlying types or use assert to narrow."

[tool.ruff.lint.isort]
known-first-party = ["puppeteer", "scripts", "schemas"]

[tool.mypy]
python_version = "3.10"
warn_return_any = false
warn_unused_configs = true
disallow_untyped_defs = false
check_untyped_defs = true
ignore_missing_imports = false

# Existing code uses dynamic player type patterns that mypy can't follow.
# These per-module overrides prevent noise while still checking new code.
[[tool.mypy.overrides]]
module = ["puppeteer.orchestrator", "puppeteer.config"]
disable_error_code = ["assignment", "attr-defined", "arg-type"]

[[tool.mypy.overrides]]
module = ["puppeteer.sleepwalker", "puppeteer.pilot", "puppeteer.auto_pass"]
disable_error_code = ["assignment", "attr-defined", "union-attr", "call-overload", "arg-type"]

[[tool.mypy.overrides]]
module = ["puppeteer.process_manager"]
disable_error_code = ["assignment"]

# No working type stubs exist for google_auth_oauthlib (the PyPI package
# google-auth-oauthlib-stubs is broken). Keep this narrow override until
# upstream ships py.typed or a working stubs package appears.
[[tool.mypy.overrides]]
module = ["google_auth_oauthlib.*"]
ignore_missing_imports = true
disable_error_code = ["import-untyped"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = ["golden: Golden prompt integration tests (require XMage server)"]
