name: Deploy

on:
  push:
    branches: [master]
  pull_request:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - run: npm ci
        working-directory: website

      - run: npm run build
        working-directory: website

      - name: Deploy to Cloudflare Pages
        id: deploy
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy website/dist/ --project-name=mage-bench --branch=${{ github.head_ref || github.ref_name }}

      - name: Print deployment URL
        run: |
          echo "Deployed to ${{ steps.deploy.outputs.deployment-url }}"
          echo "Branch URL: https://${{ github.head_ref || github.ref_name }}.mage-bench.pages.dev"
